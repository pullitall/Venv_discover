# Tests, builds and smoke-tests VenvDiscover.exe on GitHub's Windows runners.
# A version tag (v*) also gets a draft release with the zip and a build-provenance attestation;
# the draft is published by hand after review.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite on a hidden desktop
        run: python scripts/run_tests.py --workers 1

  build:
    name: Build the release zip
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = python -c "import venvdiscover; print(venvdiscover.__version__)"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match __version__ $version" }
      - name: Build VenvDiscover.exe and smoke-test it on a hidden desktop
        run: python scripts/build_release.py --skip-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VenvDiscover-zip
          path: dist/VenvDiscover-*.zip
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VenvDiscover-zip
          path: dist
      - name: Attest where the zip was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/VenvDiscover-*.zip
      - name: Create a draft release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/VenvDiscover-*.zip
          --repo "$GITHUB_REPOSITORY" --draft --title "Venv Discover ${GITHUB_REF_NAME#v}"
          --notes "Built by GitHub Actions from commit $GITHUB_SHA. Replace these notes before publishing."
